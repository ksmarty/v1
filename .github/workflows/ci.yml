name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

  go:
    name: Go vet / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # The backend embeds internal/server/dist via //go:embed. In a fresh
      # checkout that directory only contains .gitkeep, which may not satisfy
      # the embed pattern — drop in a placeholder so vet/test/build compile.
      - name: Placeholder embedded frontend
        run: |
          mkdir -p internal/server/dist
          [ -f internal/server/dist/index.html ] || \
            echo '<!doctype html><title>ci placeholder</title>' > internal/server/dist/index.html

      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build ./...

  docker:
    name: Docker build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
