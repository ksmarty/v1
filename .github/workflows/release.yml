name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        type: choice
        default: patch
        required: true
        options:
          - patch
          - minor
          - major

# Simultaneous pushes to main must not race a release: serialize them.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Compute and push next semver tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so conventional commits can be analyzed

      # Native version bump: no third-party action (the old one ran on the
      # deprecated Node 20 runtime and its token usage failed on re-runs).
      # Conventional commits since the last tag decide the bump: feat: ->
      # minor, feat!/BREAKING CHANGE -> major, anything else -> patch.
      # Manual runs pass the chosen bump input; no commits -> no release.
      - id: tag
        name: Bump version and push tag
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          BASE=${LAST#v}
          IFS=. read -r CUR_MAJOR CUR_MINOR CUR_PATCH <<< "$BASE"
          CUR_MAJOR=${CUR_MAJOR:-0}; CUR_MINOR=${CUR_MINOR:-0}; CUR_PATCH=${CUR_PATCH:-0}

          COMMITS=$(git log "$LAST..HEAD" --format=%s%n%b 2>/dev/null || true)
          if [ -z "$(printf '%s' "$COMMITS" | tr -d '[:space:]')" ]; then
            echo "No commits since $LAST — nothing to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BUMP" = "auto" ]; then
            if printf '%s' "$COMMITS" | grep -qiE '^feat!|BREAKING CHANGE'; then
              BUMP=major
            elif printf '%s' "$COMMITS" | grep -qE '^feat'; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi
          case "$BUMP" in
            major) MAJOR=$((CUR_MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MAJOR=$CUR_MAJOR; MINOR=$((CUR_MINOR + 1)); PATCH=0 ;;
            patch) MAJOR=$CUR_MAJOR; MINOR=$CUR_MINOR; PATCH=$((CUR_PATCH + 1)) ;;
            *) echo "unknown bump '$BUMP'" >&2; exit 1 ;;
          esac

          NEW="v$MAJOR.$MINOR.$PATCH"
          if git rev-parse "$NEW" >/dev/null 2>&1; then
            echo "Tag $NEW already exists — nothing to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NEW"
          git push origin "$NEW"
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"

  release:
    name: Build and push image, create GitHub Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names.
      - name: Lowercase image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.tag.outputs.tag }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
